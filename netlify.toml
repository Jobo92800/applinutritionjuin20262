[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "20"

# --- Parcours audio : les routes de l'API, avant la règle générale ---------
[[redirects]]
from = "/api/parcours"
to = "/.netlify/functions/parcours"
status = 200
[[redirects]]
from = "/api/audio"
to = "/.netlify/functions/audio"
status = 200
[[redirects]]
from = "/api/progression"
to = "/.netlify/functions/progression"
status = 200
[[redirects]]
from = "/api/admin-parcours"
to = "/.netlify/functions/admin-parcours"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/*.js"

[headers.values]
Content-Type = "application/javascript; charset=utf-8"

[[headers]]
for = "/*.css"

[headers.values]
Content-Type = "text/css; charset=utf-8"